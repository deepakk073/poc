[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-gemini-pdf-pipeline"
version = "1.0.0"
description = "Intelligent PDF Classification and Information Extraction using Gemini on Vertex AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.3.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-bigquery>=3.20.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
